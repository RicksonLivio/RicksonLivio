name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (4x per day, UTC)
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]           # also refresh when README/workflow changes

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Secret METRICS_TOKEN = classic PAT with: repo, read:org, read:user, user:email
      # ("repo" lets it read PRIVATE repos, so private JavaScript projects are counted)

      # 1) Main card: stats + most-used languages (public AND private repos)
      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Fortaleza
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30

      # 2) Contribution calendar (replaces the dead activity graph)
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: America/Fortaleza
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
