name: Update Profile

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (4x per day, UTC)
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    name: Metrics (stats, languages, calendar)
    runs-on: ubuntu-latest
    # the renders are pushed with a personal token, which triggers push events: skip those runs
    if: ${{ !contains(github.event.head_commit.message, '[Skip GitHub Action]') }}
    concurrency:
      group: metrics
      cancel-in-progress: true
    steps:
      # Secret METRICS_TOKEN = classic PAT with: repo, read:org, read:user, user:email
      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # commit the renders with the owner's token, so they show as RicksonLivio, not github-actions[bot]
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Fortaleza
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # commit the renders with the owner's token, so they show as RicksonLivio, not github-actions[bot]
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: America/Fortaleza
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  snake:
    name: Snake animation (grows when it eats)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[Skip GitHub Action]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the snake
        run: python gen_snake.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}   # PAT -> includes private contributions

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          author: Rickson Livio de Souza Gaspar <50837771+RicksonLivio@users.noreply.github.com>
          committer: Rickson Livio de Souza Gaspar <50837771+RicksonLivio@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
